<!doctype html><html><head><meta charset="utf-8"><title>ONCOURT QA</title><style>body{margin:0;background:#ddd;font:14px sans-serif}header{padding:8px}iframe{display:block;border:0;background:white;transform-origin:top left}</style></head><body><header><label>Viewport <select id="size"><option>1363x936</option><option>768x1024</option><option>390x844</option><option>3840x2160</option></select></label><label>Phase <select id="phase"><option value="0">Hero</option><option value=".08">Curtains</option><option value=".18">Closed</option><option value=".4">Film</option><option value=".66">Freeze</option><option value=".76">Ball</option><option value=".91">Fall</option><option value=".955">Hole</option><option value="1">Problem</option><option value="1.15">Connection</option></select></label><button id="apply">Apply</button></header><iframe id="site" src="index.html" width="1363" height="936"></iframe><script>apply.onclick=()=>{let [w,h]=size.value.split('x').map(Number);site.width=w;site.height=h;site.style.transform='scale('+Math.min(1,1200/w)+')';setTimeout(()=>site.contentWindow.scrollTo({top:h*7*Number(phase.value),behavior:'instant'}),900)};</script></body></html>
